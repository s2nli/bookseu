<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>RaysBook.live - Explore</title>
  <link rel="preconnect" href="https://books.streamfiles.eu.org" crossorigin>
  <link rel="stylesheet" href="css/codexstudys-popup.css">
  <style>
    html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;background:#fff}
    #site-frame{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#fff}
    @supports (height:100dvh){#site-frame{height:100dvh}}
  </style>
</head>
<body>
  <iframe
    id="site-frame"
    src="https://books.streamfiles.eu.org/"
    title="Books"
    loading="eager"
    allow="fullscreen; clipboard-write"
    allowfullscreen
    referrerpolicy="strict-origin-when-cross-origin"></iframe>

  <div class="cx-overlay" id="cx-popup" role="dialog" aria-modal="true" aria-labelledby="cx-title" aria-describedby="cx-sub" aria-hidden="true">
    <div class="cx-card">
      <div class="cx-badge" aria-hidden="true">CX</div>
      <h2 class="cx-title" id="cx-title">Join Codexstudys Community</h2>
      <p class="cx-sub" id="cx-sub">Get study updates and important announcements.</p>
      <div class="cx-actions">
        <a class="cx-btn cx-tg" href="https://t.me/codexstudys" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.5 4.3 2.9 11.5c-1.3.5-1.2 1.2-.2 1.5l4.8 1.5 1.8 5.6c.2.6.1.8.7.8.5 0 .7-.2 1-.5l2.3-2.3 4.8 3.5c.9.5 1.5.2 1.7-.8l3.2-15.1c.3-1.3-.5-1.9-1.5-1.5ZM9 14.2l9.2-5.8c.4-.3.8-.1.5.2l-7.6 6.9-.3 3.2L9 14.2Z"/></svg>
          Join on Telegram
        </a>
        <a class="cx-btn cx-wa" href="https://whatsapp.com/channel/0029VbDI2CGEAKWNSoya5L2w" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 20.5l1.6-5.4A8.4 8.4 0 1 1 21 11.5Z"/><path d="M9 8.8c.2 2.8 2.600 5.200 5.500 5.700l1.200-1.300-1.800-.9-.8.700c-1-.4-1.900-1.300-2.300-2.300l.7-.8-.9-1.800L9 8.800Z" fill="currentColor" stroke="none"/></svg>
          Join on WhatsApp
        </a>
        <button type="button" class="cx-btn cx-later">Maybe Later</button>
      </div>
    </div>
  </div>

  <noscript><p style="position:fixed;inset:0;margin:0;padding:24px;background:#fff;font-family:sans-serif">JavaScript is not required for the embedded site, but your browser may need it. <a href="https://books.streamfiles.eu.org/">Open the books site directly</a>.</p></noscript>
  <script src="js/codexstudys-popup.js"></script>
</body>
</html>
